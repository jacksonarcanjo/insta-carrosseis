<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do robô</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee;--surface:#ffffff;--surface-2:#f8f6f2;--text:#1c1b19;--muted:#6b6862;--line:#e6e2da;
  --accent:#3d6f92;--accent-soft:#e3edf4;--ok:#2f7d4f;--ok-soft:#e2f2e8;--err:#b3412f;--err-soft:#f8e4e0;--warn:#9a6b12;--warn-soft:#f6ecd6;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121315;--surface:#1b1c1f;--surface-2:#222327;--text:#ecebe8;--muted:#9a9893;--line:#2d2e32;
  --accent:#7fb2d6;--accent-soft:#1e2c37;--ok:#6fcf97;--ok-soft:#173225;--err:#f08a77;--err-soft:#3a1f1a;--warn:#e7b75b;--warn-soft:#352a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#121315;--surface:#1b1c1f;--surface-2:#222327;--text:#ecebe8;--muted:#9a9893;--line:#2d2e32;
  --accent:#7fb2d6;--accent-soft:#1e2c37;--ok:#6fcf97;--ok-soft:#173225;--err:#f08a77;--err-soft:#3a1f1a;--warn:#e7b75b;--warn-soft:#352a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);object-fit:cover;flex:none}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.two{grid-template-columns:1.1fr 1fr;margin-bottom:28px}
h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2 small{color:var(--muted);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:var(--ok-soft)}.b-err{color:var(--err);background:var(--err-soft)}.b-skip{color:var(--warn);background:var(--warn-soft)}
.next{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.msg{color:var(--muted);font-size:13px;margin-top:8px;word-break:break-word}
.queue{list-style:none}
.queue li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.queue li:first-child{border-top:0;padding-top:0}
.qd{font-size:12px;color:var(--muted);line-height:1.3}.qd b{display:block;color:var(--text);font-size:15px}
.qt{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.posts{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.post{padding:0;overflow:hidden;cursor:pointer;transition:transform .15s}
.post:hover{transform:translateY(-2px)}
.post img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--surface-2)}
.post .pb{padding:12px 14px}
.post .pt{font-weight:600;font-size:14px;line-height:1.3}
.meta{display:flex;gap:12px;color:var(--muted);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;border-top:0}
.section{margin-top:28px}
a{color:var(--accent)}
dialog{border:0;border-radius:16px;background:var(--surface);color:var(--text);max-width:min(960px,calc(100vw - 32px));width:100%;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--text);font-size:22px;cursor:pointer;line-height:1}
.strip{display:flex;gap:10px;overflow-x:auto;padding:16px 18px;scroll-snap-type:x mandatory}
.strip img{height:min(420px,60vh);aspect-ratio:4/5;border-radius:8px;scroll-snap-align:start;flex:none}
.cap{white-space:pre-wrap;padding:0 18px 18px;font-size:14px;color:var(--muted);max-height:220px;overflow:auto}
.empty{color:var(--muted);font-size:14px}
.foot{margin-top:32px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.stat .v{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="avatar" id="avatar" alt="">
    <div><h1 id="handle">Painel do robô</h1><div class="sub" id="gerado"></div></div>
  </header>

  <div class="grid stats">
    <div class="card stat"><div class="v" id="s-seg">–</div><div class="l">seguidores</div></div>
    <div class="card stat"><div class="v" id="s-robo">–</div><div class="l">posts feitos pelo robô</div></div>
    <div class="card stat"><div class="v" id="s-likes">–</div><div class="l">curtidas nos posts do robô</div></div>
    <div class="card stat"><div class="v" id="s-com">–</div><div class="l">comentários</div></div>
  </div>

  <div class="grid two">
    <div class="card">
      <h2>Status</h2>
      <div id="ultimo"></div>
      <div style="margin-top:18px;color:var(--muted);font-size:13px">Próximo post</div>
      <div class="next" id="prox">–</div>
      <div class="sub" id="prox-sub"></div>
    </div>
    <div class="card">
      <h2>Próximos posts <small>fila planejada</small></h2>
      <ul class="queue" id="fila"></ul>
    </div>
  </div>

  <div class="section">
    <h2>Já publicados <small id="n-pub"></small></h2>
    <div class="grid posts" id="posts"></div>
  </div>

  <div class="section card">
    <h2>Histórico de execuções</h2>
    <table><thead><tr><th>Quando</th><th>Status</th><th>Detalhe</th></tr></thead><tbody id="runs"></tbody></table>
  </div>

  <div class="foot">Atualizado automaticamente a cada execução do robô · dados em <a href="data.json">data.json</a></div>
</div>

<dialog id="dlg">
  <div class="dh"><b id="d-t"></b><button class="x" onclick="dlg.close()" aria-label="Fechar">×</button></div>
  <div class="strip" id="d-s"></div>
  <div class="cap" id="d-c"></div>
  <div style="padding:0 18px 18px" id="d-l"></div>
</dialog>

<script>
const DATA = {"gerado_em": "2026-11-19T21:45:29+00:00", "config": {"handle": "@darkgoodvibes", "post_time": "19:00", "timezone": "America/Sao_Paulo", "style": "v4-minimalista"}, "conta": {"id": "17841467782877912", "followers_count": 26, "media_count": 23, "profile_picture_url": "https://scontent-ord5-1.xx.fbcdn.net/v/t51.82787-15/625763579_17916410853259430_5585289471691086198_n.jpg?_nc_cat=105&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=7d201b&_nc_ohc=uANEQCmu-loQ7kNvwHNwKCA&_nc_oc=AdpVkcaBWTJZBPhar8m3TOPOjy6JYEh3NM0qKZFrZ4-cFfYI6nUhtQA-_xq6272u-Zs&_nc_zt=23&_nc_ht=scontent-ord5-1.xx&edm=AJ-jyNUEAAAA&_nc_gid=IRIyoUSkqhD30LuxwIS8_Q&oh=00_AQRKPS4iAlr5t-VYNnvZbC__a-lFpYTVK3t3CDk_XAarVA&oe=6B055B9E", "username": "darkgoodvibes"}, "metricas": {"18150758095567283": {"curtidas": 3, "comentarios": 0}, "18160411753522774": {"curtidas": 3, "comentarios": 0}, "18117682187146843": {"curtidas": 0, "comentarios": 0}}, "erro_api": null, "execucoes": [{"data": "2026-11-19", "quando": "19/11/2026 18:45", "status": "ok", "mensagem": "Amizade que salva", "link": "https://www.instagram.com/p/Df8E5BDF3Q8/"}, {"data": "2026-11-18", "quando": "18/11/2026 21:24", "status": "ok", "mensagem": "Deus não desiste de você (publicado manualmente após a Meta liberar a API)", "link": "https://www.instagram.com/p/Df5yXieIWHC/"}, {"data": "2026-11-18", "quando": "18/11/2026 18:41", "status": "erro", "mensagem": "Não publicado: a Meta bloqueou o acesso do app à API (erro 200 / 5258005 \"API access blocked\"). Sessão automática também não tinha permissão de push (corrigido)."}, {"data": "2026-11-18", "quando": "18/11/2026 00:42", "status": "ok", "mensagem": "Post de estreia (publicado manualmente na configuração): Por que anime te motiva tanto?", "link": "https://www.instagram.com/p/Df3kI8Doa1D/"}], "fila": [{"tema": "Quando a ansiedade aperta", "personagens": ["Shinji", "Hinata (Haikyuu)", "Anya", "Tanjiro", "Nagi"]}, {"tema": "Recomeçar não é fracasso", "personagens": ["Violet Evergarden", "Thorfinn", "Frieren", "Mob", "Kousei"]}, {"tema": "Pare de se comparar", "personagens": ["Deku e Bakugo", "Vegeta e Goku", "Sakura", "Usopp", "Isagi"]}, {"tema": "Saudade de quem se foi", "personagens": ["Frieren e Himmel", "Ace", "Jiraiya", "Kaori", "Maes Hughes"]}, {"tema": "Disciplina vence talento", "personagens": ["Rock Lee", "Sung Jin-Woo", "Saitama", "Tanjiro", "Asta"]}, {"tema": "Você merece descanso", "personagens": ["Shikamaru", "Totoro", "Yotsuba", "Kaguya", "Mitsuha"]}, {"tema": "Fé quando tudo parece silêncio", "personagens": ["Frieren", "Tanjiro", "Violet Evergarden", "Naruto", "Luffy"], "nota": "Post cristão de domingo (29/11): anime como ponte para falar de fé e esperança em Deus nos dias de silêncio. 1–2 versículos com referência exata e texto fiel (ex.: Salmos 46:10, Isaías 40:31). Tom acolhedor, sem polêmica. Hashtags #jesus #fé #deus #cristão + anime."}], "posts": [{"pasta": "2026-11-19", "slides": ["https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-19/slide_01.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-19/slide_02.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-19/slide_03.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-19/slide_04.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-19/slide_05.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-19/slide_06.jpg"], "legenda": "Você pode passar anos achando que precisa dar conta de tudo sozinho e, no processo, esquecer que ninguém foi feito para carregar o mundo inteiro 🤍\n\nÉ uma ideia que parece força. Mas, na maioria das vezes, é só cansaço disfarçado.\n\nNa psicologia, a gente sabe que conexão é uma das coisas que mais protegem a nossa saúde emocional. Não precisa ser uma multidão. Às vezes basta uma pessoa que pergunta \"e aí, como você está de verdade?\" e espera a resposta.\n\nO Ed e o Al perderam o corpo, a casa e a infância, mas nunca perderam um ao outro. O Hinata e o Kageyama começaram brigando e terminaram completando as frases um do outro dentro da quadra 💭\n\nO Reigen mentia sobre quase tudo, menos sobre o quanto se importava com o Mob. E o Shoya, de A Silent Voice, só voltou a levantar a cabeça porque alguém teve paciência de ficar enquanto ele aprendia a se perdoar.\n\nIsso não significa que amizade resolve tudo, nem que você precisa de muita gente por perto. Significa reconhecer que algumas pessoas são o lugar onde a gente consegue respirar ✨\n\nTalvez você já tenha alguém assim. Talvez ainda esteja chegando.\n\nQuem chega e fica, salva.\n\nQuem é a pessoa que te salvou sem nem perceber? Marca ela aqui nos comentários, ela merece saber.\nSalva para reler num dia difícil e manda para quem precisa ouvir isso hoje.\n\nSiga @darkgoodvibes para continuar encontrando nos animes reflexões sobre a sua própria história.\n\n#anime #animes #animebrasil #otaku #amizade #fullmetalalchemist #haikyuu #mobpsycho100 #asilentvoice #reflexão", "tema": "Amizade que salva", "publicado": {"id": "18117682187146843", "permalink": "https://www.instagram.com/p/Df8E5BDF3Q8/", "timestamp": "2026-11-19T21:45:12+0000", "username": "darkgoodvibes"}, "personagens": ["Ed", "Al", "Hinata", "Kageyama", "Mob", "Reigen", "Shoya"], "metricas": {"curtidas": 0, "comentarios": 0}}, {"pasta": "2026-11-18", "slides": ["https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18/slide_01.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18/slide_02.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18/slide_03.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18/slide_04.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18/slide_05.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18/slide_06.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18/slide_07.jpg"], "legenda": "Deus não desiste de você, nem nos dias em que você desiste de si mesmo 💭\n\nTem dias em que a gente se sente longe demais pra ser alcançado. Errou de novo, se afastou, cansou de tentar. E começa a acreditar que talvez já tenha passado do ponto.\n\nO Naruto nunca deixou de correr atrás do Sasuke. O Thorfinn recebeu um recomeço que achava não merecer. O Tanjiro enxergava valor até em quem todos já tinham condenado. Histórias assim mexem com a gente porque falam de um amor que não depende do nosso desempenho ✝️\n\n“Porque eu estou bem certo de que nem a morte, nem a vida, nem as coisas do presente, nem do porvir, nem qualquer outra criatura poderá separar-nos do amor de Deus, que está em Cristo Jesus, nosso Senhor.” Romanos 8:38-39\n\nVocê pode se perder no caminho. Ele continua sabendo onde te encontrar ❤️\n\nNão é sobre o quanto você aguenta segurar. É sobre quem nunca te soltou.\n\nEm qual momento você sentiu que Deus não tinha desistido de você? Me conta aqui nos comentários.\nSalva para reler num dia difícil e manda para quem precisa ouvir isso hoje.\n\nSiga @darkgoodvibes para continuar encontrando nos animes reflexões sobre a sua própria história.\n\n#jesus #fé #deus #cristão #anime #animes #animebrasil #naruto #vinlandsaga #demonslayer #violetevergarden #onepiece", "tema": "Deus não desiste de você", "publicado": {"id": "18160411753522774", "permalink": "https://www.instagram.com/p/Df5yXieIWHC/", "timestamp": "2026-11-19T00:24:49+0000", "username": "darkgoodvibes"}, "personagens": ["Naruto", "Sasuke", "Thorfinn", "Tanjiro", "Violet Evergarden", "Luffy"], "metricas": {"curtidas": 3, "comentarios": 0}}, {"pasta": "2026-11-18-estreia", "slides": ["https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18-estreia/slide_01.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18-estreia/slide_02.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18-estreia/slide_03.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18-estreia/slide_04.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18-estreia/slide_05.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18-estreia/slide_06.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18-estreia/slide_07.jpg", "https://raw.githubusercontent.com/jacksonarcanjo/insta-carrosseis/main/posts/2026-11-18-estreia/slide_08.jpg"], "legenda": "Por que anime te motiva tanto? 💭\n\nNão é pelos poderes nem pelas lutas. É porque quase toda história começa com alguém que ainda não chegou lá: sozinho, desacreditado, com medo. Exatamente como a gente se sente em tantos dias 💭\n\nO Rock Lee treinou até o corpo não aguentar. O Midoriya tremia antes de cada luta e foi mesmo assim. O Asta foi rejeitado por todos e transformou cada queda em parte da história. Os mundos são fantásticos, mas as dores são as nossas ❤️\n\nNo fim, eles nos ensinam que motivação não é nunca querer desistir. É dar o próximo passo, mesmo cansado ✨\n\nE você? Qual personagem já te fez continuar quando pensou em desistir? Me conta aqui nos comentários 👇", "tema": "motivação (por que anime motiva)", "publicado": {"id": "18150758095567283", "permalink": "https://www.instagram.com/p/Df3kI8Doa1D/", "timestamp": "2026-11-18T03:42:05+0000", "username": "darkgoodvibes"}, "personagens": ["Deku", "Naruto", "Rock Lee", "Asta", "Gon", "Killua"], "metricas": {"curtidas": 3, "comentarios": 0}}]};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN = n => (n ?? '–').toLocaleString?.('pt-BR') ?? n;
const TZ = 'America/Sao_Paulo';
const fmtDate = (d, o) => new Intl.DateTimeFormat('pt-BR', {timeZone: TZ, ...o}).format(d);

function brNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(new Date()).map(x => [x.type, x.value]));
  return {date: `${p.year}-${p.month}-${p.day}`, h: +p.hour, m: +p.minute};
}
function nextPostDates(n) {
  const [hh, mm] = (DATA.config.post_time || '19:00').split(':').map(Number);
  const now = brNow();
  const postedToday = DATA.posts.some(p => p.pasta === now.date && p.publicado);
  let start = new Date(now.date + 'T12:00:00Z');
  if (postedToday || now.h * 60 + now.m > hh * 60 + mm + 30) start.setUTCDate(start.getUTCDate() + 1);
  return Array.from({length: n}, (_, i) => { const d = new Date(start); d.setUTCDate(d.getUTCDate() + i); return d; });
}

function render() {
  const c = DATA.conta || {};
  $('handle').textContent = '@' + (c.username || (DATA.config.handle || '').replace('@', '') || 'perfil');
  if (c.profile_picture_url) $('avatar').src = c.profile_picture_url;
  $('gerado').textContent = 'Atualizado em ' + fmtDate(new Date(DATA.gerado_em), {dateStyle: 'short', timeStyle: 'short'}) + (DATA.erro_api ? ' · números da conta podem estar desatualizados' : '');
  const pub = DATA.posts.filter(p => p.publicado);
  $('s-seg').textContent = fmtN(c.followers_count);
  $('s-robo').textContent = pub.length;
  $('s-likes').textContent = fmtN(pub.reduce((a, p) => a + (p.metricas?.curtidas || 0), 0));
  $('s-com').textContent = fmtN(pub.reduce((a, p) => a + (p.metricas?.comentarios || 0), 0));

  const last = DATA.execucoes[0];
  const cls = {ok: 'b-ok', erro: 'b-err', pulado: 'b-skip'};
  const lbl = {ok: 'Publicado', erro: 'Erro', pulado: 'Pulado'};
  $('ultimo').innerHTML = last
    ? `<span class="badge ${cls[last.status] || 'b-skip'}">${lbl[last.status] || esc(last.status)}</span>
       <span class="sub" style="margin-left:6px">${esc(last.quando || last.data)}</span>
       <div class="msg">${esc(last.mensagem || '')}${last.link ? ` · <a href="${esc(last.link)}" target="_blank" rel="noopener">ver post</a>` : ''}</div>`
    : '<div class="empty">Nenhuma execução registrada ainda.</div>';

  const dates = nextPostDates(7);
  $('prox').textContent = fmtDate(dates[0], {weekday: 'long', day: '2-digit', month: '2-digit', timeZone: 'UTC'}) + ' · ' + (DATA.config.post_time || '19:00');
  $('prox-sub').textContent = DATA.fila[0] ? 'Tema: ' + DATA.fila[0].tema : '';
  $('fila').innerHTML = DATA.fila.length ? DATA.fila.map((f, i) => `
    <li><div class="qd"><b>${fmtDate(dates[i], {day: '2-digit', month: '2-digit', timeZone: 'UTC'})}</b>${fmtDate(dates[i], {weekday: 'short', timeZone: 'UTC'})}</div>
    <div><div class="qt">${esc(f.tema)}</div><div class="chips">${(f.personagens || []).map(p => `<span class="chip">${esc(p)}</span>`).join('')}</div></div></li>`).join('')
    : '<li class="empty">Fila vazia: o robô escolhe o tema na hora.</li>';

  $('n-pub').textContent = pub.length ? `${pub.length} post${pub.length > 1 ? 's' : ''}` : '';
  $('posts').innerHTML = DATA.posts.length ? DATA.posts.map((p, i) => {
    const when = p.publicado?.timestamp ? fmtDate(new Date(p.publicado.timestamp), {dateStyle: 'short', timeStyle: 'short'}) : p.pasta;
    const title = p.tema || (p.legenda.split('\n')[0] || p.pasta);
    return `<div class="card post" onclick="openPost(${i})">
      <img loading="lazy" src="${esc(p.slides[0])}" alt="">
      <div class="pb"><div class="pt">${esc(title)}</div>
      <div class="meta"><span>${esc(when)}</span>${p.publicado ? `<span>♥ ${fmtN(p.metricas?.curtidas)}</span><span>💬 ${fmtN(p.metricas?.comentarios)}</span>` : '<span>não publicado</span>'}</div></div></div>`;
  }).join('') : '<div class="empty">Nenhum post ainda.</div>';

  $('runs').innerHTML = DATA.execucoes.length ? DATA.execucoes.map(r => `<tr>
    <td>${esc(r.quando || r.data)}</td><td><span class="badge ${cls[r.status] || 'b-skip'}">${lbl[r.status] || esc(r.status)}</span></td>
    <td>${esc(r.mensagem || '')}${r.link ? ` · <a href="${esc(r.link)}" target="_blank" rel="noopener">post</a>` : ''}</td></tr>`).join('')
    : '<tr><td colspan="3" class="empty">Sem execuções.</td></tr>';
}

function openPost(i) {
  const p = DATA.posts[i];
  $('d-t').textContent = p.tema || p.pasta;
  $('d-s').innerHTML = p.slides.map(s => `<img loading="lazy" src="${esc(s)}" alt="">`).join('');
  $('d-c').textContent = p.legenda;
  $('d-l').innerHTML = p.publicado?.permalink ? `<a href="${esc(p.publicado.permalink)}" target="_blank" rel="noopener">Abrir no Instagram →</a>` : '';
  $('dlg').showModal();
}
const dlg = $('dlg');
render();
</script>
</body>
</html>
